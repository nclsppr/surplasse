name: Container images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "docs/**"
      - "docs-nimbus/**"
      - "frontends/**"
      - "brand/**"
      - "config/domains/**"
      - "config/deployment/images.env"
      - "infra/images/**"
      - "scripts/check-container-images.sh"
      - "scripts/validate-production-stripe-public-key"
      - "scripts/verify-production-stripe-static-assets"
      - "scripts/test-backend-migration-image.sh"
      - "scripts/compose.sh"
      - "scripts/test-compose-config.sh"
      - "compose.yaml"
      - "compose.*.yaml"
      - "deployment/vps/**"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/images.yml"
      - ".github/workflows/vps-integration.yml"
      - "scripts/*vps*"
      - "scripts/*application-release*"
      - "scripts/lib/application_release.py"
      - "scripts/lib/release_gate.py"
      - "scripts/lib/vps_*.py"
      - "tests/test_application_release.py"
      - "tests/test_release_gate.py"
      - "tests/test_vps_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_ROOT: ghcr.io/${{ github.repository }}
  TRIVY_VERSION: v0.72.0

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stripe_public_key_sha256: ${{ steps.stripe_key.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate Dockerfiles with BuildKit
        run: npm run images:check
      - name: Validate both Compose profiles and production guardrails
        run: npm run compose:config:test
      - name: Require the Stripe live publishable key before a main release
        id: stripe_key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          ./scripts/validate-production-stripe-public-key
          key_sha256="$(printf '%s' "$VITE_STRIPE_PUBLISHABLE_KEY" | sha256sum)"
          echo "sha256=${key_sha256%% *}" >> "$GITHUB_OUTPUT"

  build-and-scan:
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infra/images/backend.Dockerfile
          - image: onboarding
            dockerfile: infra/images/onboarding.Dockerfile
          - image: commande
            dockerfile: infra/images/frontend.Dockerfile
          - image: dashboard
            dockerfile: infra/images/frontend.Dockerfile
          - image: docs
            dockerfile: infra/images/docs.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve pinned build arguments
        id: arguments
        env:
          EXPECTED_STRIPE_PUBLIC_KEY_SHA256: ${{ needs.configuration.outputs.stripe_public_key_sha256 }}
          IMAGE_NAME: ${{ matrix.image }}
          REQUIRE_EXPECTED_STRIPE_PUBLIC_KEY_SHA256: "true"
          REQUIRE_LIVE_STRIPE_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          STRIPE_PUBLIC_VALUE: ${{ matrix.image == 'commande' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VITE_STRIPE_PUBLISHABLE_KEY || '' }}
        run: |
          source config/deployment/images.env
          source config/domains/production.env
          docs_origin="${APP_SCHEME}://docs.${APP_BASE_DOMAIN}"
          if [[ "$IMAGE_NAME" == "commande" && "$REQUIRE_LIVE_STRIPE_KEY" == "true" ]]; then
            VITE_STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLIC_VALUE" \
              ./scripts/validate-production-stripe-public-key
          fi
          {
            echo "value<<BUILD_ARGS"
            case "$IMAGE_NAME" in
              backend)
                echo "TEMURIN_BUILD_IMAGE=$TEMURIN_BUILD_IMAGE"
                echo "TEMURIN_RUNTIME_IMAGE=$TEMURIN_RUNTIME_IMAGE"
                echo "DOMAIN_PROFILE=production"
                ;;
              onboarding)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "DOMAIN_PROFILE=production"
                ;;
              commande)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "DOMAIN_PROFILE=production"
                echo "FRONTEND_NAME=$IMAGE_NAME"
                echo "STRIPE_PUBLIC_VALUE=$STRIPE_PUBLIC_VALUE"
                ;;
              dashboard)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "DOMAIN_PROFILE=production"
                echo "FRONTEND_NAME=$IMAGE_NAME"
                ;;
              docs)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "NIMBUS_SITE_ORIGIN=$docs_origin"
                echo "NIMBUS_BASE_PATH=/"
                ;;
              *)
                exit 64
                ;;
            esac
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"
      - name: Build the production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.arguments.outputs.value }}
          load: true
          pull: true
          tags: surplasse-ci/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-production
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-production
      - name: Run the Backend migration command against PostgreSQL 17
        if: matrix.image == 'backend'
        run: >-
          ./scripts/test-backend-migration-image.sh
          surplasse-ci/backend:${{ github.sha }}
      - name: Verify the live Stripe key is embedded in Commande
        if: matrix.image == 'commande' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_STRIPE_PUBLIC_KEY_SHA256: ${{ needs.configuration.outputs.stripe_public_key_sha256 }}
          REQUIRE_EXPECTED_STRIPE_PUBLIC_KEY_SHA256: "true"
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          ./scripts/validate-production-stripe-public-key
          docker run --rm --interactive \
            --entrypoint /bin/sh \
            --env VITE_STRIPE_PUBLISHABLE_KEY \
            surplasse-ci/commande:${{ github.sha }} \
            -s -- /usr/share/nginx/html \
            < ./scripts/verify-production-stripe-static-assets
      - name: Scan HIGH and CRITICAL fixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: surplasse-ci/${{ matrix.image }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - configuration
      - build-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infra/images/backend.Dockerfile
          - image: onboarding
            dockerfile: infra/images/onboarding.Dockerfile
          - image: commande
            dockerfile: infra/images/frontend.Dockerfile
          - image: dashboard
            dockerfile: infra/images/frontend.Dockerfile
          - image: docs
            dockerfile: infra/images/docs.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pinned build arguments
        id: arguments
        env:
          EXPECTED_STRIPE_PUBLIC_KEY_SHA256: ${{ needs.configuration.outputs.stripe_public_key_sha256 }}
          IMAGE_NAME: ${{ matrix.image }}
          REQUIRE_EXPECTED_STRIPE_PUBLIC_KEY_SHA256: "true"
          STRIPE_PUBLIC_VALUE: ${{ matrix.image == 'commande' && vars.VITE_STRIPE_PUBLISHABLE_KEY || '' }}
        run: |
          source config/deployment/images.env
          source config/domains/production.env
          docs_origin="${APP_SCHEME}://docs.${APP_BASE_DOMAIN}"
          if [[ "$IMAGE_NAME" == "commande" ]]; then
            VITE_STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLIC_VALUE" \
              ./scripts/validate-production-stripe-public-key
          fi
          {
            echo "value<<BUILD_ARGS"
            case "$IMAGE_NAME" in
              backend)
                echo "TEMURIN_BUILD_IMAGE=$TEMURIN_BUILD_IMAGE"
                echo "TEMURIN_RUNTIME_IMAGE=$TEMURIN_RUNTIME_IMAGE"
                echo "DOMAIN_PROFILE=production"
                ;;
              onboarding)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "DOMAIN_PROFILE=production"
                ;;
              commande)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "DOMAIN_PROFILE=production"
                echo "FRONTEND_NAME=$IMAGE_NAME"
                echo "STRIPE_PUBLIC_VALUE=$STRIPE_PUBLIC_VALUE"
                ;;
              dashboard)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "DOMAIN_PROFILE=production"
                echo "FRONTEND_NAME=$IMAGE_NAME"
                ;;
              docs)
                echo "NODE_IMAGE=$NODE_IMAGE"
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "NIMBUS_SITE_ORIGIN=$docs_origin"
                echo "NIMBUS_BASE_PATH=/"
                ;;
              *)
                exit 64
                ;;
            esac
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"
      - name: Push the immutable image with SBOM and provenance
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.arguments.outputs.value }}
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_ROOT }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-production
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-production
          sbom: true
          provenance: mode=max
      - name: Verify the live Stripe key in the published Commande digest
        if: matrix.image == 'commande'
        env:
          EXPECTED_STRIPE_PUBLIC_KEY_SHA256: ${{ needs.configuration.outputs.stripe_public_key_sha256 }}
          REQUIRE_EXPECTED_STRIPE_PUBLIC_KEY_SHA256: "true"
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          ./scripts/validate-production-stripe-public-key
          docker run --rm --interactive --pull=always \
            --entrypoint /bin/sh \
            --env VITE_STRIPE_PUBLISHABLE_KEY \
            "${IMAGE_ROOT}/commande@${{ steps.push.outputs.digest }}" \
            -s -- /usr/share/nginx/html \
            < ./scripts/verify-production-stripe-static-assets
      - name: Scan the exact published digest for fixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_ROOT }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish the GitHub artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_ROOT }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
