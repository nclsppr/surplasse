---
name: VPS integration release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vps-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APPLICATION_RELEASE_ARTIFACT_TYPE: application/vnd.vps-infra.application-release.v1
  APPLICATION_RELEASE_LAYER_MEDIA_TYPE: application/vnd.vps-infra.application-release.v1+json
  APPLICATION_RELEASE_REPOSITORY: ghcr.io/${{ github.repository }}/application-release
  SOURCE_URL: https://github.com/${{ github.repository }}
  VPS_ARCHIVE_MEDIA_TYPE: application/vnd.vps-infra.application-integration.v1+tar+gzip
  VPS_ARTIFACT_TYPE: application/vnd.vps-infra.application-integration.v1
  VPS_INTEGRATION_REPOSITORY: ghcr.io/${{ github.repository }}/vps-integration
  VPS_INVENTORY_MEDIA_TYPE: application/vnd.vps-infra.application-integration.inventory.v1+json

jobs:
  validate:
    name: Validate application release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install locked tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Run adversarial contract tests
        run: npm run vps:release:check

      - name: Build and verify the deterministic contracts twice
        shell: bash
        run: |
          set -Eeuo pipefail
          images="${RUNNER_TEMP}/component-images.json"
          IMAGES="${images}" python3 -c '
          import json, os
          revision = os.environ["GITHUB_SHA"]
          root = "ghcr.io/nclsppr/surplasse"
          names = ("backend", "onboarding", "commande", "dashboard", "docs")
          value = {
              name: f"{root}/{name}@sha256:{index:064x}"
              for index, name in enumerate(names, start=1)
          }
          with open(os.environ["IMAGES"], "w", encoding="utf-8") as output:
              json.dump(value, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          '

          for build in first second; do
            directory="${RUNNER_TEMP}/${build}"
            ./scripts/build-vps-integration \
              --revision "${GITHUB_SHA}" \
              --component-images "${images}" \
              --output-directory "${directory}"
            ./scripts/verify-vps-integration \
              --archive "${directory}/integration.tar.gz" \
              --inventory "${directory}/inventory.json" \
              --expected-revision "${GITHUB_SHA}"
            ./scripts/build-application-release \
              --revision "${GITHUB_SHA}" \
              --expected-images "${directory}/expected-images.json" \
              --integration-reference \
                "${VPS_INTEGRATION_REPOSITORY}@sha256:$(printf 'f%.0s' {1..64})" \
              --migrations "${directory}/migrations.json" \
              --probes "${directory}/probes.json" \
              --output "${directory}/application-release.json"
            ./scripts/verify-application-release \
              --release "${directory}/application-release.json" \
              --revision "${GITHUB_SHA}" \
              --expected-images "${directory}/expected-images.json" \
              --migrations "${directory}/migrations.json" \
              --probes "${directory}/probes.json"
          done
          cmp "${RUNNER_TEMP}/first/integration.tar.gz" \
            "${RUNNER_TEMP}/second/integration.tar.gz"
          cmp "${RUNNER_TEMP}/first/inventory.json" \
            "${RUNNER_TEMP}/second/inventory.json"
          cmp "${RUNNER_TEMP}/first/application-release.json" \
            "${RUNNER_TEMP}/second/application-release.json"

  publish:
    name: Publish immutable application release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install locked publication tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.7.13
          cache: true
        env:
          MISE_GITHUB_ATTESTATIONS: "true"
          MISE_GITHUB_SLSA: "true"
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Run adversarial contract tests
        run: npm run vps:release:check

      - name: Wait for stable green gates on this exact push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ./scripts/wait-vps-release-gates \
            --revision "${GITHUB_SHA}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --timeout 9000 \
            --output "${RUNNER_TEMP}/same-revision-gates.json"

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and attest the five exact application images
        id: images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ./scripts/resolve-vps-images \
            --revision "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/component-images.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build and verify the deterministic integration package
        id: package
        shell: bash
        env:
          COMPONENT_IMAGES: ${{ steps.images.outputs.component_images }}
        run: |
          set -Eeuo pipefail
          package_directory="${RUNNER_TEMP}/vps-integration-package"
          ./scripts/build-vps-integration \
            --revision "${GITHUB_SHA}" \
            --component-images "${COMPONENT_IMAGES}" \
            --output-directory "${package_directory}" \
            --github-output "${GITHUB_OUTPUT}"
          ./scripts/verify-vps-integration \
            --archive "${package_directory}/integration.tar.gz" \
            --inventory "${package_directory}/inventory.json" \
            --expected-revision "${GITHUB_SHA}"

      - name: Push the immutable integration artifact
        id: integration
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CREATED: ${{ steps.package.outputs.created }}
          INVENTORY: ${{ steps.package.outputs.inventory }}
        run: |
          set -Eeuo pipefail
          package_directory=$(dirname -- "${ARCHIVE}")
          result=$(
            cd -- "${package_directory}"
            oras push \
              --no-tty \
              --format json \
              --artifact-type "${VPS_ARTIFACT_TYPE}" \
              --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.created=${CREATED}" \
              "${VPS_INTEGRATION_REPOSITORY}:sha-${GITHUB_SHA}" \
              "integration.tar.gz:${VPS_ARCHIVE_MEDIA_TYPE}" \
              "inventory.json:${VPS_INVENTORY_MEDIA_TYPE}"
          )
          digest=$(python3 -c '
          import json, re, sys
          value = json.load(sys.stdin).get("digest")
          if not isinstance(value, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
              raise SystemExit("ORAS did not return an immutable digest")
          print(value)
          ' <<<"${result}")
          {
            echo "digest=${digest}"
            echo "reference=${VPS_INTEGRATION_REPOSITORY}@${digest}"
            echo "tag=${VPS_INTEGRATION_REPOSITORY}:sha-${GITHUB_SHA}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify the integration registry round trip
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_DIGEST: ${{ steps.package.outputs.archive_digest }}
          CREATED: ${{ steps.package.outputs.created }}
          INVENTORY: ${{ steps.package.outputs.inventory }}
          INVENTORY_DIGEST: ${{ steps.package.outputs.inventory_digest }}
          MANIFEST_DIGEST: ${{ steps.integration.outputs.digest }}
          TAG: ${{ steps.integration.outputs.tag }}
        run: |
          set -Eeuo pipefail
          remote="${RUNNER_TEMP}/remote-integration"
          mkdir -m 0700 "${remote}"
          oras manifest fetch --output "${remote}/manifest.json" "${TAG}"
          ./scripts/verify-vps-integration-manifest \
            --manifest "${remote}/manifest.json" \
            --expected-digest "${MANIFEST_DIGEST}" \
            --archive "${ARCHIVE}" \
            --inventory "${INVENTORY}" \
            --expected-revision "${GITHUB_SHA}" \
            --expected-created "${CREATED}"
          oras blob fetch --output "${remote}/integration.tar.gz" \
            "${VPS_INTEGRATION_REPOSITORY}@${ARCHIVE_DIGEST}"
          oras blob fetch --output "${remote}/inventory.json" \
            "${VPS_INTEGRATION_REPOSITORY}@${INVENTORY_DIGEST}"
          cmp "${ARCHIVE}" "${remote}/integration.tar.gz"
          cmp "${INVENTORY}" "${remote}/inventory.json"
          ./scripts/verify-vps-integration \
            --archive "${remote}/integration.tar.gz" \
            --inventory "${remote}/inventory.json" \
            --expected-revision "${GITHUB_SHA}" \
            --expected-created "${CREATED}"

      - name: Attest the verified integration artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/vps-integration
          subject-digest: ${{ steps.integration.outputs.digest }}
          push-to-registry: true

      - name: Verify exact integration provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE: ${{ steps.integration.outputs.reference }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "oci://${REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/vps-integration.yml" \
            --deny-self-hosted-runners \
            --format json \
            >"${RUNNER_TEMP}/integration-attestation.json"
          RESULT="${RUNNER_TEMP}/integration-attestation.json" python3 -c '
          import json, os
          with open(os.environ["RESULT"], encoding="utf-8") as source:
              value = json.load(source)
          if not isinstance(value, list) or not value:
              raise SystemExit("GitHub returned no verified integration attestation")
          '

      - name: Build and verify the single Atlas release descriptor
        id: release
        shell: bash
        env:
          EXPECTED_IMAGES: ${{ steps.package.outputs.expected_images }}
          INTEGRATION_REFERENCE: ${{ steps.integration.outputs.reference }}
          MIGRATIONS: ${{ steps.package.outputs.migrations }}
          PROBES: ${{ steps.package.outputs.probes }}
        run: |
          set -Eeuo pipefail
          release="${RUNNER_TEMP}/application-release.json"
          ./scripts/build-application-release \
            --revision "${GITHUB_SHA}" \
            --expected-images "${EXPECTED_IMAGES}" \
            --integration-reference "${INTEGRATION_REFERENCE}" \
            --migrations "${MIGRATIONS}" \
            --probes "${PROBES}" \
            --output "${release}" \
            --github-output "${GITHUB_OUTPUT}"
          ./scripts/verify-application-release \
            --release "${release}" \
            --revision "${GITHUB_SHA}" \
            --expected-images "${EXPECTED_IMAGES}" \
            --migrations "${MIGRATIONS}" \
            --probes "${PROBES}"

      - name: Push the single immutable Atlas release
        id: published_release
        shell: bash
        env:
          CREATED: ${{ steps.package.outputs.created }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -Eeuo pipefail
          directory=$(dirname -- "${RELEASE}")
          result=$(
            cd -- "${directory}"
            oras push \
              --no-tty \
              --format json \
              --artifact-type "${APPLICATION_RELEASE_ARTIFACT_TYPE}" \
              --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.created=${CREATED}" \
              "${APPLICATION_RELEASE_REPOSITORY}:sha-${GITHUB_SHA}" \
              "application-release.json:${APPLICATION_RELEASE_LAYER_MEDIA_TYPE}"
          )
          digest=$(python3 -c '
          import json, re, sys
          value = json.load(sys.stdin).get("digest")
          if not isinstance(value, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
              raise SystemExit("ORAS did not return an immutable release digest")
          print(value)
          ' <<<"${result}")
          {
            echo "digest=${digest}"
            echo "reference=${APPLICATION_RELEASE_REPOSITORY}@${digest}"
            echo "tag=${APPLICATION_RELEASE_REPOSITORY}:sha-${GITHUB_SHA}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify the release registry round trip
        shell: bash
        env:
          CREATED: ${{ steps.package.outputs.created }}
          MANIFEST_DIGEST: ${{ steps.published_release.outputs.digest }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_DIGEST: ${{ steps.release.outputs.release_digest }}
          TAG: ${{ steps.published_release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          remote="${RUNNER_TEMP}/remote-release"
          mkdir -m 0700 "${remote}"
          oras manifest fetch --output "${remote}/manifest.json" "${TAG}"
          ./scripts/verify-application-release-manifest \
            --manifest "${remote}/manifest.json" \
            --expected-digest "${MANIFEST_DIGEST}" \
            --release "${RELEASE}" \
            --revision "${GITHUB_SHA}" \
            --created "${CREATED}"
          oras blob fetch --output "${remote}/application-release.json" \
            "${APPLICATION_RELEASE_REPOSITORY}@${RELEASE_DIGEST}"
          cmp "${RELEASE}" "${remote}/application-release.json"
          ./scripts/verify-application-release \
            --release "${remote}/application-release.json" \
            --revision "${GITHUB_SHA}" \
            --expected-images "${{ steps.package.outputs.expected_images }}" \
            --migrations "${{ steps.package.outputs.migrations }}" \
            --probes "${{ steps.package.outputs.probes }}"

      - name: Attest the verified application release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/application-release
          subject-digest: ${{ steps.published_release.outputs.digest }}
          push-to-registry: true

      - name: Verify exact application release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE: ${{ steps.published_release.outputs.reference }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "oci://${REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/vps-integration.yml" \
            --deny-self-hosted-runners \
            --format json \
            >"${RUNNER_TEMP}/release-attestation.json"
          RESULT="${RUNNER_TEMP}/release-attestation.json" python3 -c '
          import json, os
          with open(os.environ["RESULT"], encoding="utf-8") as source:
              value = json.load(source)
          if not isinstance(value, list) or not value:
              raise SystemExit("GitHub returned no verified release attestation")
          '

      - name: Recheck canonical HEAD and gates after publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ./scripts/wait-vps-release-gates \
            --revision "${GITHUB_SHA}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --timeout 30 \
            --poll-seconds 5 \
            --stable-polls 1 \
            --output "${RUNNER_TEMP}/same-revision-gates-after.json"

      - name: Write immutable release evidence
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CREATED: ${{ steps.package.outputs.created }}
          INTEGRATION_REFERENCE: ${{ steps.integration.outputs.reference }}
          INVENTORY: ${{ steps.package.outputs.inventory }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_REFERENCE: ${{ steps.published_release.outputs.reference }}
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/release-evidence"
          mkdir -m 0700 "${evidence}"
          ./scripts/write-vps-integration-evidence \
            --artifact-reference "${INTEGRATION_REFERENCE}" \
            --archive "${ARCHIVE}" \
            --inventory "${INVENTORY}" \
            --revision "${GITHUB_SHA}" \
            --created "${CREATED}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${evidence}/vps-integration.json"
          ./scripts/write-application-release-evidence \
            --artifact-reference "${RELEASE_REFERENCE}" \
            --release "${RELEASE}" \
            --revision "${GITHUB_SHA}" \
            --created "${CREATED}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${evidence}/application-release.json"
          cp "${RUNNER_TEMP}/same-revision-gates.json" \
            "${evidence}/same-revision-gates.json"
          cp "${RUNNER_TEMP}/same-revision-gates-after.json" \
            "${evidence}/same-revision-gates-after.json"
          cp "${RUNNER_TEMP}/integration-attestation.json" \
            "${evidence}/integration-attestation.json"
          cp "${RUNNER_TEMP}/release-attestation.json" \
            "${evidence}/release-attestation.json"

      - name: Upload raw release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Report the immutable Atlas signal
        shell: bash
        env:
          INTEGRATION_REFERENCE: ${{ steps.integration.outputs.reference }}
          RELEASE_REFERENCE: ${{ steps.published_release.outputs.reference }}
        run: |
          set -Eeuo pipefail
          {
            echo '### Published immutable application release'
            echo
            echo "Source revision: \`${GITHUB_SHA}\`"
            echo "Atlas signal: \`${RELEASE_REFERENCE}\`"
            echo "Integration bundle: \`${INTEGRATION_REFERENCE}\`"
            echo
            echo 'Publication does not activate a VPS deployment by itself.'
          } >>"${GITHUB_STEP_SUMMARY}"
