<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Surplasse, vos commandes, vos clients, votre restaurant</title>
  <desc id="description">Carte sociale produit Surplasse. Le logo horizontal canonique accompagne un parcours de la carte du restaurant au ticket cuisine, avec la mention production testeurs.</desc>
  <style>
    @font-face {
      font-family: "Archivo";
      font-style: normal;
      font-weight: 400 900;
      src: url("fonts/archivo-400_900-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Space Mono";
      font-style: normal;
      font-weight: 400;
      src: url("fonts/spacemono-400-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Space Mono";
      font-style: normal;
      font-weight: 700;
      src: url("fonts/spacemono-700-latin.woff2") format("woff2");
    }
    .display { font-family: "Archivo", sans-serif; }
    .meta { font-family: "Space Mono", monospace; }
  </style>

  <rect width="1200" height="630" fill="#F4F4F0"/>
  <rect width="20" height="630" fill="#FA550C"/>

  <!-- The contractual horizontal logo is inserted intact and scaled proportionally. -->
  <image href="surplasse-logo-horizontal.svg" x="68" y="48" width="340" height="74.3" preserveAspectRatio="xMinYMid meet"/>
  <text class="meta" x="1134" y="79" fill="#181818" font-size="15" text-anchor="end" letter-spacing="1.2">SURPLASSE.COM</text>
  <rect x="68" y="143" width="1066" height="2" fill="#181818"/>

  <text class="meta" x="68" y="192" fill="#181818" font-size="16" font-weight="700" letter-spacing="1.8">LE CIRCUIT COURT DE LA COMMANDE</text>
  <text class="display" x="64" y="276" fill="#181818" font-size="64" font-weight="800" letter-spacing="-2.4">
    <tspan x="64" dy="0">Vos commandes.</tspan>
    <tspan x="64" dy="70">Vos clients.</tspan>
    <tspan x="64" dy="70">Votre restaurant.</tspan>
  </text>
  <text class="display" x="68" y="485" fill="#181818" font-size="23" font-weight="500" letter-spacing="-0.25">De la table à la cuisine, sans marketplace.</text>

  <rect x="748" y="171" width="397" height="274" fill="#FA550C"/>
  <rect x="735" y="158" width="397" height="274" fill="#181818"/>
  <!-- The existing product-flow illustration is reused without recoloring. -->
  <image href="illustrations/service-line.svg" x="752" y="174" width="363" height="242" preserveAspectRatio="xMidYMid meet"/>

  <rect x="735" y="467" width="397" height="57" fill="none" stroke="#181818" stroke-width="2"/>
  <text class="meta" x="754" y="493" fill="#181818" font-size="13" font-weight="700" letter-spacing="1.2">PRODUCTION TESTEURS</text>
  <text class="meta" x="754" y="513" fill="#181818" font-size="11" letter-spacing="0.8">COMMANDES ET DONNÉES DE TEST</text>

  <rect x="20" y="548" width="1180" height="82" fill="#FA550C"/>
  <text class="meta" x="68" y="598" fill="#181818" font-size="16" font-weight="700" letter-spacing="1.4">PHOTO · CARTE NUMÉRIQUE · QR À TABLE · CUISINE</text>
</svg>
